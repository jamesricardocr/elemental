name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Create frontend .env with VITE variables
      run: |
        cat > frontend/.env << 'EOF'
        VITE_GOOGLE_MAPS_API_KEY=AIzaSyBs2LGBZyfVdHUuAZlNJpF-SydBHAwdb_k
        EOF

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true

    - name: Deploy files to server
      run: |
        # Crear directorios en el servidor
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "mkdir -p /srv/Elemental/frontend/dist"

        # Copiar frontend build (compilado en GitHub Actions)
        rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          frontend/dist/ \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/Elemental/frontend/dist/

        # Copiar archivos del backend y configuración
        rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          src \
          config \
          migrations \
          scripts \
          data \
          alembic \
          alembic.ini \
          requirements.txt \
          init_db.py \
          load_puntos_referencia.py \
          .env.example \
          Dockerfile \
          docker-compose.yml \
          docker-compose.prod.yml \
          .dockerignore \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/Elemental/

    - name: Deploy with Docker (Production Mode)
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          cd /srv/Elemental

          # Backup de DB (seguridad, no se modifica)
          if [ -f "iap_database.db" ]; then
            mkdir -p backups
            cp iap_database.db backups/iap_database_backup_$(date +%Y%m%d_%H%M%S).db
            echo "✅ Backup de DB creado"
            # Mantener solo últimos 10 backups
            ls -t backups/iap_database_backup_*.db 2>/dev/null | tail -n +11 | xargs -r rm
          fi

          # Actualizar configuración de Nginx
          echo "🔧 Actualizando configuración de Nginx..."
          sudo cp config/nginx/elemental.jc2r.com.conf /etc/nginx/sites-available/elemental.jc2r.com
          sudo nginx -t && sudo systemctl reload nginx
          echo "✅ Nginx actualizado"

          # Build y restart con Docker Compose PRODUCCIÓN (solo backend)
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d

          # Esperar a que servicios estén listos
          echo "⏳ Esperando que servicios inicien..."
          sleep 10

          # Ver estado
          echo "📊 Estado de contenedores:"
          docker compose -f docker-compose.prod.yml ps

          # Ver logs del backend
          echo "📋 Logs del backend:"
          docker compose -f docker-compose.prod.yml logs --tail=20 backend

          # Verificar Nginx
          echo "📋 Verificando Nginx..."
          curl -I http://localhost/ || echo "Nginx no responde en localhost"

          echo "✅ Deployment en modo PRODUCCIÓN completado"
        ENDSSH
