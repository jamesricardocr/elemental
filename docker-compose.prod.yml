services:
  backend:
    build: .
    container_name: elemental-backend
    restart: always
    ports:
      - "8001:8000"
    volumes:
      # Solo montamos datos y database (NO código fuente)
      - ./data:/app/data
      - ./iap_database.db:/app/iap_database.db
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - elemental-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NOTA: Frontend NO se ejecuta en Docker
  # El Nginx del sistema sirve los archivos estáticos directamente desde frontend/dist/
  # Ver README_CICD.md para la configuración de Nginx del sistema

networks:
  elemental-network:
    driver: bridge
